name: geoattend
description: A GPS-based attendance management app for small offices.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.25.4
  cloud_firestore: ^4.15.9
  geolocator: ^11.0.1
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^8.0.0
  http: ^1.2.0
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
